# ==============================================================================
# DeFang (Bharat Edition) - LocalStack ₹0 Serverless Emulation
# Compatible with AWS Finch Compose and Docker Compose
# ==============================================================================

version: '3.8'

services:
  localstack:
    container_name: defang-localstack
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway & APIs
      - "127.0.0.1:4510-4559:4510-4559"  # External service port range
    environment:
      - SERVICES=serverless,s3,opensearch,lambda,apigateway
      - AWS_DEFAULT_REGION=ap-south-1
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional standalone OpenSearch node for testing large case law indices
  opensearch:
    container_name: defang-opensearch
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=defang-cluster
      - node.name=defang-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
