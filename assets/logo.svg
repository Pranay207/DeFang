<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF6B00" />
      <stop offset="45%" stopColor="#EF4444" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="innerShieldGrad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="8" y1="36" x2="40" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#EF4444" />
    </linearGradient>
    <linearGradient id="fangGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#EF4444" />
      <stop offset="100%" stopColor="#7F1D1D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield Frame -->
  <path d="M24 3 L41 9.5 V23 C41 33.5 24 45 24 45 C24 45 7 33.5 7 23 V9.5 L24 3 Z" fill="url(#shieldGrad)" />

  <!-- Inner Dark Cavity -->
  <path d="M24 5.5 L38.5 11.2 V22.5 C38.5 31.8 24 42.5 24 42.5 C24 42.5 9.5 31.8 9.5 22.5 V11.2 L24 5.5 Z" fill="url(#innerShieldGrad)" stroke="#1E293B" strokeWidth="1" />

  <!-- Scales of Justice Geometric Grid -->
  <circle cx="24" cy="24" r="11" stroke="#334155" strokeWidth="0.75" strokeDasharray="2 2" opacity="0.4" />
  <line x1="24" y1="13" x2="24" y2="35" stroke="#334155" strokeWidth="0.75" opacity="0.3" />
  <line x1="13" y1="24" x2="35" y2="24" stroke="#334155" strokeWidth="0.75" opacity="0.3" />

  <!-- The Toxic Fangs -->
  <path d="M17 16 L21 27 L18 27 Z" fill="url(#fangGrad)" opacity="0.9" />
  <path d="M31 16 L27 27 L30 27 Z" fill="url(#fangGrad)" opacity="0.9" />

  <!-- The DeFang Slicing Strike Blade -->
  <path d="M11 32 L37 14" stroke="url(#bladeGrad)" strokeWidth="2.5" strokeLinecap="round" filter="url(#glow)" />

  <!-- Central Statutory Diamond -->
  <path d="M24 20 L27 24 L24 28 L21 24 Z" fill="#10B981" filter="url(#glow)" />

  <!-- Active Policy Dot -->
  <circle cx="41" cy="39" r="4.5" fill="#020617" />
  <circle cx="41" cy="39" r="3.5" fill="#10B981" />
  <circle cx="41" cy="39" r="1.5" fill="#FFFFFF" />
</svg>
